name: turtlewow

services:
  mariadb:
    image: mariadb:10.11
    container_name: turtlewow-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-mangos}
      MARIADB_DATABASE: tw_logon
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ${SQL_PATH:-./database/sql}:/source_sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 300s
    networks:
      - turtle-network

  authserver:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        GIT_REPO: ${GIT_REPO:-https://github.com/d3athbl0w/twow-1172.git}
        GIT_BRANCH: ${GIT_BRANCH:-master}
    container_name: turtlewow-authserver
    restart: unless-stopped
    tty: true
    stdin_open: true
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${AUTH_PORT:-3724}:3724"
    volumes:
      - ./config/realmd.conf:/app/etc/realmd.conf:ro
      - ./scripts/entrypoint-auth.sh:/app/scripts/entrypoint-auth.sh:ro
      - ./logs:/app/logs
    entrypoint: ["/bin/bash", "-c", "tr -d '\\r' < /app/scripts/entrypoint-auth.sh > /tmp/entrypoint.sh && exec /bin/bash /tmp/entrypoint.sh"]
    networks:
      - turtle-network

  worldserver:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        GIT_REPO: ${GIT_REPO:-https://github.com/d3athbl0w/twow-1172.git}
        GIT_BRANCH: ${GIT_BRANCH:-master}
    container_name: turtlewow-worldserver
    restart: unless-stopped
    tty: true
    stdin_open: true
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${WORLD_PORT:-8091}:8091"
    volumes:
      - ${DATA_PATH:-./data}:/app/data:ro
      - ./config/mangosd.conf:/app/etc/mangosd.conf:ro
      - ./config/anticheat.conf:/app/etc/anticheat.conf:ro
      - ./scripts/entrypoint-world.sh:/app/scripts/entrypoint-world.sh:ro
      - ./logs:/app/logs
    entrypoint: ["/bin/bash", "-c", "tr -d '\\r' < /app/scripts/entrypoint-world.sh > /tmp/entrypoint.sh && exec /bin/bash /tmp/entrypoint.sh"]
    networks:
      - turtle-network

  builder:
    build:
      context: .
      dockerfile: Dockerfile.builder
    container_name: turtlewow-builder
    profiles: ["dev"]
    volumes:
      - ${SOURCE_PATH:-../patch_1172}:/src
      - build_cache:/src/build
      - ./scripts:/app/scripts:ro
    entrypoint: ["/bin/bash", "/app/scripts/rebuild.sh"]
    networks:
      - turtle-network

volumes:
  mariadb_data:
    name: turtlewow_mariadb_data
  build_cache:
    name: turtlewow_build_cache

networks:
  turtle-network:
    name: turtle-network
    driver: bridge
